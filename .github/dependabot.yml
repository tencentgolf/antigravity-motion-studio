version: 2
updates:
  # 1. Node.js / Remotion / Three.js dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      remotion:
        patterns:
          - "remotion"
          - "@remotion/*"
      threejs:
        patterns:
          - "three"
          - "@types/three"
          - "@react-three/*"
          - "three-custom-shader-material"

  # 2. Python TTS, Whisper, Audio DSP & Diffusers dependencies
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5

  # 3. GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
