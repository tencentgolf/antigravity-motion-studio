name: Studio CI & Typecheck

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install Node dependencies
        run: npm install --legacy-peer-deps

      - name: TypeScript & Remotion Typecheck
        run: npm run typecheck

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Validate Python CLI Scripts & ComfyUI Workflows
        run: |
          python -m py_compile scripts/*.py
          python -c "import json, glob; [json.load(open(f, encoding='utf-8')) for f in glob.glob('workflows/comfyui/*.json')]"
